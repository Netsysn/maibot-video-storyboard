# 视频分镜插件本地配置（改动即热重载，不需要重启 OneKey）

[plugin]
config_version = "1.3.0"
enabled = true

[trigger]
trigger_mode = "all"
allow_groups = []
deny_groups = []
max_videos_per_message = 1
skip_short_seconds = 1.0
report_failure = true
link_videos = true
link_domains = ["b23.tv", "bilibili.com", "bili2233.cn", "youtu.be", "youtube.com", "v.douyin.com", "douyin.com", "xhslink.com", "xiaohongshu.com", "weibo.com", "v.qq.com", "ixigua.com"]

[media]
download_timeout_seconds = 60
max_file_mb = 80
napcat_cache_dir = ""
link_quality = 480
link_max_seconds = 600
link_timeout_seconds = 180
max_link_mb = 80
cookies_file = ""

[storyboard]
ffmpeg_path = "C:/Users/N/AppData/Roaming/MaiBotOneKeyDesktop/23064c81e6dc/tools/ffmpeg/bin/ffmpeg.exe"
ffprobe_path = "C:/Users/N/AppData/Roaming/MaiBotOneKeyDesktop/23064c81e6dc/tools/ffmpeg/bin/ffprobe.exe"
cells = 9
columns = 3
max_seconds = 180
cell_edge = 420
font_path = "C:/Windows/Fonts/msyhbd.ttc"
show_timestamp = true
ffmpeg_timeout_seconds = 90
jpeg_quality = 85

[vlm]
task_name = "vlm"
model_name = ""
temperature = 0.3
max_tokens = 2048
max_chars = 480
style = "chat"

[cache]
enabled = true
max_entries = 200

[debug]
log_ffmpeg = false
keep_temp_files = false

[extra]
enabled = true
danmaku_count = 60
danmaku_max_chars = 40
comment_count = 20
comment_max_chars = 100
comment_mode = 3
timeout_seconds = 20.0
